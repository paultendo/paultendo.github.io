name: Mirror to Substack

# Runs after every deploy, and by hand for particular posts. Without the SUBSTACK_COOKIE
# secret (set with `npm run substack:login -- --github`) it does nothing.
on:
  workflow_call:
    secrets:
      SUBSTACK_COOKIE:
        required: false
  workflow_dispatch:
    inputs:
      only:
        description: Only these posts (slugs, comma-separated)
        required: false
      email:
        description: Email posts from the last few days to subscribers
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: substack
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SUBSTACK_COOKIE: ${{ secrets.SUBSTACK_COOKIE }}
      ONLY: ${{ inputs.only }}
      NO_EMAIL: ${{ inputs.email == false && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tables and diagrams are pictured in open fonts, Noto for anything the site's own fonts lack
      - if: env.SUBSTACK_COOKIE != ''
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: npm run substack:mirror -- ${ONLY:+--only "$ONLY"} ${NO_EMAIL:+--no-email}
